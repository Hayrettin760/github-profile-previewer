<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Sayfa Önizleme</title>
    
    <!-- Google Font & Font Awesome İkon Kütüphanesi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
    <link rel="icon" type="image/png" href="https://github.githubassets.com/favicons/favicon.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Montserrat", sans-serif;
        }

        body {
            background-color: rgb(33, 33, 33);
            color: white;
        }

        .container {
            text-align: center;
            margin-top: 30px;
        }

        /* Dil Seçimi Butonları */
        .dil-secimi {
            margin-bottom: 20px;
        }

        .dil-btn {
            background-color: #222;
            color: white;
            border: 1px solid #555;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 4px;
            transition: 0.2s;
        }

        .dil-btn:hover {
            background-color: #555;
        }

        .container i.fa-github {
            color: white;
            font-size: 80px;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p.aciklama {
            color: #ccc;
            margin-bottom: 20px;
        }

        /* Arama Kutusu ve Buton Alanı */
        .arama-kutusu {
            margin-bottom: 25px;
        }

        #kullaniciAdiInput {
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #222;
            color: white;
            outline: none;
            width: 250px;
        }

        #araButonu {
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 8px;
            border: none;
            background-color: #555;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-left: 8px;
        }

        #araButonu:hover {
            background-color: #777;
        }

        /* Ortalanmış ve Kavisli Kart */
        #kart {
            width: 380px;
            background-color: #424242;
            margin: 30px auto;        /* 🎯 Ekranda tam ortalar */
            border-radius: 30px;      /* 📐 30px yuvarlatılmış kavisli köşeler */
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;            /* İlk başta gizli */
        }

        #profilResmi {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid white;
            object-fit: cover;
        }

        #kullaniciAdi {
            font-size: 22px;
            margin-bottom: 8px;
        }

        #biyo {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .istatistikler {
            display: flex;
            justify-content: space-around;
            background-color: #2c2c2c;
            padding: 12px;
            border-radius: 10px;
        }

        .istatistik-item {
            font-size: 14px;
            font-weight: 600;
        }

        .istatistik-item i {
            font-size: 16px;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Dil Butonları -->
        <div class="dil-secimi">
            <button class="dil-btn" onclick="dilDegistir('tr')">TR</button>
            <button class="dil-btn" onclick="dilDegistir('en')">EN</button>
            <button class="dil-btn" onclick="dilDegistir('de')">DE</button>
        </div>

        <!-- GitHub Ana İkonu -->
        <i class="fa-brands fa-github"></i>

        <h1 id="baslikMetni">Hoşgeldiniz Github Ön İzleme</h1>
        <p class="aciklama" id="aciklamaMetni">Burada kullanıcı adını girip depo sayısını ve takipçisini görebilirsiniz</p>

        <!-- Arama Alanı -->
        <div class="arama-kutusu">
            <input type="text" id="kullaniciAdiInput" placeholder="GitHub Kullanıcı Adı Giriniz">
            <button id="araButonu">Ara</button>
        </div>

        <!-- Profil Kartı -->
        <div id="kart">
            <img id="profilResmi" src="" alt="Profil Resmi">
            <h2 id="kullaniciAdi">Kullanıcı Adı</h2>
            <p id="biyo">Biyografi</p>

            <div class="istatistikler">
                <div class="istatistik-item">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <span id="depoEtiketi">Depo</span>: <span id="repoSayisi">0</span>
                </div>
                <div class="istatistik-item">
                    <i class="fa-solid fa-users"></i>
                    <span id="takipciEtiketi">Takipçi</span>: <span id="takipciSayisi">0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js.js"></script>
</body>
</html>
